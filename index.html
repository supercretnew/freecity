<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бесплатный сайт</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; 
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 20px; }
        .btn { 
            background: #667eea; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 10px; 
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
        }
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); 
            justify-content: center; 
            align-items: center; 
        }
        .modal-content { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            width: 90%; 
            max-width: 400px; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
        }
        .log { 
            background: #f5f5f5; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
            text-align: left;
            font-size: 14px;
        }
        .success { background: #d4ffd4; }
        .error { background: #ffd4d4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Бесплатный сайт</h1>
        <button class="btn" onclick="openModal()">Хочу сайт</button>
        <button class="btn" onclick="showLogs()">Логи</button>
        
        <div id="status"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>Введите @username</h3>
            <input type="text" id="username" placeholder="@username">
            <button class="btn" onclick="submitRequest()">Отправить</button>
            <button class="btn" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <div class="modal" id="logsModal">
        <div class="modal-content">
            <h3>Логи запросов</h3>
            <div id="logsContainer"></div>
            <button class="btn" onclick="closeLogs()">Закрыть</button>
            <button class="btn" onclick="clearLogs()">Очистить</button>
        </div>
    </div>

    <script>
        // Простые функции для логов
        function addLog(message, type = 'info') {
            const log = {
                time: new Date().toLocaleTimeString(),
                message: message,
                type: type
            };
            
            let logs = JSON.parse(localStorage.getItem('site_logs') || '[]');
            logs.push(log);
            localStorage.setItem('site_logs', JSON.stringify(logs));
            
            console.log('📝 ' + message);
            showStatus(message, type);
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="log ${type}">${new Date().toLocaleTimeString()}: ${message}</div>`;
        }

        function showLogs() {
            const logs = JSON.parse(localStorage.getItem('site_logs') || '[]');
            const container = document.getElementById('logsContainer');
            
            if (logs.length === 0) {
                container.innerHTML = '<div class="log">Логов нет</div>';
            } else {
                container.innerHTML = logs.map(log => 
                    `<div class="log ${log.type}">${log.time}: ${log.message}</div>`
                ).join('');
            }
            
            document.getElementById('logsModal').style.display = 'flex';
        }

        function clearLogs() {
            localStorage.removeItem('site_logs');
            showLogs();
        }

        // Основные функции
        function openModal() {
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function closeLogs() {
            document.getElementById('logsModal').style.display = 'none';
        }

        async function submitRequest() {
            const username = document.getElementById('username').value.trim();
            
            if (!username.startsWith('@')) {
                addLog('Ошибка: username должен начинаться с @', 'error');
                return;
            }

            addLog(`Начинаем отправку для: ${username}`, 'info');

            // ТЕСТ 1: Проверяем доступность PHP сервера
            const phpServerUrl = 'https://supercret.ps.fhgdps.com/aisup/handler.php';
            
            addLog(`Пытаемся подключиться к: ${phpServerUrl}`, 'info');

            try {
                // Простой GET запрос чтобы проверить доступность
                addLog('Проверяем доступность сервера...', 'info');
                
                const response = await fetch(phpServerUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        username: username,
                        test: true 
                    }),
                    timeout: 10000
                });

                addLog(`Статус ответа: ${response.status}`, 'info');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                addLog(`Ответ сервера: ${JSON.stringify(data)}`, 'success');
                
                if (data.success) {
                    addLog('✅ Заявка отправлена в Telegram!', 'success');
                } else {
                    addLog(`❌ Ошибка сервера: ${data.error}`, 'error');
                }

            } catch (error) {
                addLog(`❌ Ошибка сети: ${error.message}`, 'error');
                addLog('Проверь:', 'error');
                addLog('1. URL PHP хостинга правильный?', 'error');
                addLog('2. Файл handler.php загружен?', 'error');
                addLog('3. CORS настроен на сервере?', 'error');
            }
        }

        // Показываем последний статус при загрузке
        window.addEventListener('load', () => {
            addLog('Страница загружена. Готов к работе!', 'success');
        });

        // Закрытие модалок по клику вне
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal')) {
                e.target.style.display = 'none';
            }
        });
    </script>
</body>
</html>
