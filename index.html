<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бесплатный сайт</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; 
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 20px; }
        .btn { 
            background: #667eea; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 10px; 
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
        }
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); 
            justify-content: center; 
            align-items: center; 
        }
        .modal-content { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            width: 90%; 
            max-width: 400px; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
        }
        .log { 
            background: #f5f5f5; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
            text-align: left;
            font-size: 14px;
        }
        .success { background: #d4ffd4; }
        .error { background: #ffd4d4; }
        .info { background: #d4eaff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Бесплатный сайт</h1>
        <button class="btn" onclick="openModal()">Хочу сайт</button>
        <button class="btn" onclick="showLogs()">Логи</button>
        <button class="btn" onclick="testConnection()">Тест связи</button>
        
        <div id="status"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>Введите @username</h3>
            <input type="text" id="username" placeholder="@username">
            <button class="btn" onclick="submitRequest()">Отправить в Telegram</button>
            <button class="btn" onclick="closeModal()">Закрыть</button>
            <div id="message"></div>
        </div>
    </div>

    <div class="modal" id="logsModal">
        <div class="modal-content">
            <h3>Логи запросов</h3>
            <div id="logsContainer"></div>
            <button class="btn" onclick="closeLogs()">Закрыть</button>
            <button class="btn" onclick="clearLogs()">Очистить</button>
        </div>
    </div>

    <script>
        // Конфигурация
        const BOT_TOKEN = '8514217047:AAGB3mpTrTIHtOKGf5XBePnx-qF6EAGLBRQ';
        const CHAT_ID = '7337792719';
        
        // CORS прокси - обход блокировки браузера
        const CORS_PROXIES = [
            'https://cors-anywhere.herokuapp.com/',
            'https://api.codetabs.com/v1/proxy?quest=',
            'https://corsproxy.io/?',
            ''
        ];

        let currentProxyIndex = 0;

        function getProxyUrl(url) {
            return CORS_PROXIES[currentProxyIndex] + url;
        }

        function rotateProxy() {
            currentProxyIndex = (currentProxyIndex + 1) % CORS_PROXIES.length;
            addLog(`Переключили на прокси: ${CORS_PROXIES[currentProxyIndex] || 'Прямое соединение'}`, 'info');
        }

        // Функции для логов
        function addLog(message, type = 'info') {
            const log = {
                time: new Date().toLocaleString('ru-RU'),
                message: message,
                type: type
            };
            
            let logs = JSON.parse(localStorage.getItem('site_logs') || '[]');
            logs.push(log);
            localStorage.setItem('site_logs', JSON.stringify(logs));
            
            console.log('📝 ' + message);
            showStatus(message, type);
            return log;
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="log ${type}">${new Date().toLocaleTimeString()}: ${message}</div>`;
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="log ${type}">${message}</div>`;
        }

        function showLogs() {
            const logs = JSON.parse(localStorage.getItem('site_logs') || '[]');
            const container = document.getElementById('logsContainer');
            
            if (logs.length === 0) {
                container.innerHTML = '<div class="log">Логов нет</div>';
            } else {
                container.innerHTML = logs.reverse().map(log => 
                    `<div class="log ${log.type}"><strong>${log.time}</strong><br>${log.message}</div>`
                ).join('');
            }
            
            document.getElementById('logsModal').style.display = 'flex';
        }

        function clearLogs() {
            localStorage.removeItem('site_logs');
            showLogs();
        }

        // Основные функции
        function openModal() {
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('message').innerHTML = '';
        }

        function closeLogs() {
            document.getElementById('logsModal').style.display = 'none';
        }

        // Тест связи с Telegram
        async function testConnection() {
            addLog('🔧 Тестируем подключение к Telegram...', 'info');
            
            const telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/getMe`;
            
            for (let i = 0; i < CORS_PROXIES.length; i++) {
                currentProxyIndex = i;
                const proxyUrl = getProxyUrl(telegramUrl);
                
                addLog(`Пробуем прокси ${i + 1}/${CORS_PROXIES.length}: ${CORS_PROXIES[i] || 'Прямое соединение'}`, 'info');
                
                try {
                    const response = await fetch(proxyUrl, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                        }
                    });

                    addLog(`Статус: ${response.status}`, 'info');

                    if (response.ok) {
                        const data = await response.json();
                        if (data.ok) {
                            addLog(`✅ Успех! Бот: ${data.result.first_name} (@${data.result.username})`, 'success');
                            showStatus(`Бот активен: ${data.result.first_name}`, 'success');
                            return true;
                        } else {
                            addLog(`❌ Ошибка бота: ${data.description}`, 'error');
                        }
                    } else {
                        addLog(`❌ HTTP ошибка: ${response.status}`, 'error');
                    }
                } catch (error) {
                    addLog(`❌ Ошибка сети: ${error.message}`, 'error');
                }
                
                // Ждем перед следующей попыткой
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            addLog('❌ Все прокси не работают. Пробуем отправить заявку...', 'error');
            return false;
        }

        // ОСНОВНАЯ ФУНКЦИЯ - отправка в Telegram
        async function submitRequest() {
            const username = document.getElementById('username').value.trim();
            
            if (!username.startsWith('@') || username.length < 2) {
                showMessage('❌ Введите корректный username (начинается с @)', 'error');
                return;
            }

            addLog(`Начинаем отправку для: ${username}`, 'info');
            showMessage('🕐 Отправляем в Telegram...', 'info');

            const message = `🎯 НОВАЯ ЗАЯВКА НА фри написание сайта!\n\n👤 Пользователь: ${username}\n🕒 Время: ${new Date().toLocaleString('ru-RU')}\n🌐 Сайт: ${window.location.href}\n\nсвяжись с ним!`;

            const telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const postData = {
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'HTML'
            };

            let success = false;

            // Пробуем все прокси по очереди
            for (let i = 0; i < CORS_PROXIES.length && !success; i++) {
                currentProxyIndex = i;
                const proxyUrl = getProxyUrl(telegramUrl);
                
                addLog(`Попытка ${i + 1}: ${CORS_PROXIES[i] || 'Прямое соединение'}`, 'info');

                try {
                    const response = await fetch(proxyUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify(postData)
                    });

                    addLog(`Статус ответа: ${response.status}`, 'info');

                    if (response.ok) {
                        const data = await response.json();
                        if (data.ok) {
                            addLog(`✅ Сообщение отправлено! ID: ${data.result.message_id}`, 'success');
                            showMessage('✅ Заявка отправлена! Мы свяжемся с вами в Telegram.', 'success');
                            success = true;
                            
                            setTimeout(() => {
                                closeModal();
                            }, 3000);
                        } else {
                            addLog(`❌ Telegram error: ${data.description}`, 'error');
                        }
                    } else {
                        addLog(`❌ HTTP error: ${response.status}`, 'error');
                    }
                } catch (error) {
                    addLog(`❌ Network error: ${error.message}`, 'error');
                }

                // Ждем перед следующей попыткой
                if (!success && i < CORS_PROXIES.length - 1) {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
            }

            if (!success) {
                showMessage('❌ Не удалось отправить. Попробуйте позже.', 'error');
                addLog('💡 Решение: Нужен PHP хостинг или работающий CORS прокси', 'error');
            }
        }

        // Показываем последний статус при загрузке
        window.addEventListener('load', () => {
            addLog('Страница загружена. Готов к работе!', 'success');
        });

        // Закрытие модалок по клику вне
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal')) {
                e.target.style.display = 'none';
            }
        });

        // Отправка по Enter
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitRequest();
            }
        });
    </script>
</body>
</html>
