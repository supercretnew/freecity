<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бесплатный сайт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 1rem;
            margin: 15px 0;
        }

        .submit-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            width: 100%;
        }

        .message {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }

        .debug-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Получите профессиональный сайт бесплатно!</h1>
        <button class="btn-primary" onclick="openModal()">Хочу бесплатный сайт</button>
        
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Оставьте заявку</h2>
            <input type="text" id="username" class="input-field" placeholder="@username" required>
            <button class="submit-btn" onclick="submitRequest()">Отправить заявку</button>
            <div class="message" id="message"></div>
        </div>
    </div>

    <script>
        // Функция для сохранения логов в GitHub
        async function saveToGitHubLogs(logData) {
            const logEntry = {
                timestamp: new Date().toISOString(),
                username: logData.username,
                status: logData.status,
                message: logData.message,
                userAgent: navigator.userAgent,
                referrer: document.referrer,
                url: window.location.href
            };

            try {
                // Сохраняем в localStorage для резервного копирования
                const existingLogs = JSON.parse(localStorage.getItem('site_logs') || '[]');
                existingLogs.push(logEntry);
                localStorage.setItem('site_logs', JSON.stringify(existingLogs));

                // Пытаемся сохранить в GitHub через GitHub Pages
                await saveToGitHubPages(logEntry);
                
                return true;
            } catch (error) {
                console.error('Ошибка сохранения логов:', error);
                return false;
            }
        }

        // Функция для сохранения в GitHub Pages (используем GitHub API)
        async function saveToGitHubPages(logEntry) {
            // Для этого нужно создать отдельный endpoint или использовать GitHub Actions
            // Пока сохраняем только в localStorage и выводим в консоль
            console.log('📝 ЛОГ ЗАПИСАН:', logEntry);
            
            // В реальном проекте здесь был бы fetch к вашему API
            // который сохраняет логи в репозиторий через GitHub API
        }

        // Функция для показа отладочной информации
        function showDebugInfo(info) {
            const debugDiv = document.getElementById('debugInfo');
            debugDiv.innerHTML = `<strong>Отладочная информация:</strong><br>${info}`;
            debugDiv.style.display = 'block';
        }

        function openModal() {
            document.getElementById('modal').style.display = 'flex';
        }

        async function submitRequest() {
            const username = document.getElementById('username').value.trim();
            const messageDiv = document.getElementById('message');
            const submitBtn = document.querySelector('.submit-btn');

            if (!username.startsWith('@') || username.length < 2) {
                showMessage('❌ Введите корректный username', 'error');
                return;
            }

            // Сохраняем лог начала запроса
            await saveToGitHubLogs({
                username: username,
                status: 'started',
                message: 'Запрос начат'
            });

            submitBtn.textContent = 'Отправка...';
            submitBtn.disabled = true;

            try {
                // Твой PHP сервер
                const phpServerUrl = 'https://твой-php-хостинг.com/handler.php';
                
                const response = await fetch(phpServerUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username: username })
                });

                const data = await response.json();

                if (data.success) {
                    // Лог успешной отправки
                    await saveToGitHubLogs({
                        username: username,
                        status: 'success',
                        message: 'Заявка отправлена в Telegram'
                    });
                    
                    showMessage('✅ Заявка отправлена!', 'success');
                    showDebugInfo(`Username: ${username}<br>Статус: Успешно<br>Время: ${new Date().toLocaleString()}`);
                    
                    setTimeout(() => {
                        document.getElementById('modal').style.display = 'none';
                        submitBtn.textContent = 'Отправить заявку';
                        submitBtn.disabled = false;
                    }, 3000);
                } else {
                    // Лог ошибки
                    await saveToGitHubLogs({
                        username: username,
                        status: 'error',
                        message: data.error || 'Неизвестная ошибка'
                    });
                    
                    showMessage('❌ Ошибка: ' + data.error, 'error');
                    submitBtn.textContent = 'Отправить заявку';
                    submitBtn.disabled = false;
                }

            } catch (error) {
                // Лог ошибки сети
                await saveToGitHubLogs({
                    username: username,
                    status: 'network_error',
                    message: error.message
                });
                
                showMessage('❌ Ошибка сети', 'error');
                showDebugInfo(`Ошибка: ${error.message}<br>Проверьте консоль браузера (F12)`);
                submitBtn.textContent = 'Отправить заявку';
                submitBtn.disabled = false;
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }

        // Показываем существующие логи при загрузке
        window.addEventListener('load', () => {
            const existingLogs = JSON.parse(localStorage.getItem('site_logs') || '[]');
            if (existingLogs.length > 0) {
                showDebugInfo(`Всего записей в логах: ${existingLogs.length}<br>Последняя: ${existingLogs[existingLogs.length - 1].timestamp}`);
            }
        });
    </script>
</body>
</html>
